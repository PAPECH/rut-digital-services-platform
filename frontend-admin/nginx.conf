server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50M;

  # Docker's embedded DNS -- re-resolve `backend` on every request (short TTL) instead of
  # caching whatever IP it had when nginx started. Without this, `proxy_pass http://backend:8000`
  # resolves once at worker startup and keeps using that IP forever, so every time the backend
  # container is recreated (rebuild, restart) it gets a new address on the bridge network and
  # this container starts 502-ing until *it* is also restarted. A variable in proxy_pass forces
  # nginx through the resolver instead of the static-hostname fast path.
  resolver 127.0.0.11 valid=10s;

  # SPA fallback. `index.html` itself must never be cached -- Vite content-hashes every JS/CSS
  # filename it references, so a stale cached `index.html` keeps pointing at assets from a
  # previous deploy that no longer exist in this container, and a plain reload (which browsers
  # often serve from cache for a document with no explicit Cache-Control) silently shows the old
  # build with no error. The hashed assets below stay long-cached; only the entry document that
  # names them needs revalidating on every request.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # API / WS прокидываются внешним nginx прод-сервера.
  # В docker-compose dev можно дополнительно проксировать /api → backend, если нужно:
  # No URI after the variable here on purpose: with a variable in proxy_pass, nginx does not
  # do its usual "replace the matched location prefix" rewrite -- it forwards the original
  # request URI unchanged. Since `/api/...` and `/ws/...` already match what the backend
  # itself expects (see backend/app/main.py mounting api_router at "/api"), forwarding
  # unchanged is exactly right; adding a trailing /api/ here would double it into /api/api/....
  location /api/ {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /ws/ {
    set $backend_upstream backend:8000;
    rewrite ^/ws/(.*)$ /api/ws/$1 break;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 7d;
    access_log off;
  }
}
