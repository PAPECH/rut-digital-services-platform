name: rut-multibot-prod

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5218:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  bot-secrets-init:
    image: alpine:3.20
    restart: "no"
    command: ['sh', '-c', 'chown 10001:10001 /secrets && chmod 700 /secrets']
    volumes:
      - bot-secrets:/secrets

  backend:
    build:
      context: ./backend
      target: runtime
    image: rut-multibot/backend:${IMAGE_TAG:-rut}
    restart: unless-stopped
    env_file: ${SERVICE_ENV_FILE:-.env}
    environment:
      APP_ROLE: api
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot-secrets-init:
        condition: service_completed_successfully
    volumes:
      - uploads-data:/app/uploads
      - bot-secrets:/app/secrets
    ports:
      - '127.0.0.1:8001:8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build:
      context: ./backend
      target: runtime
    image: rut-multibot/backend:${IMAGE_TAG:-rut}
    restart: unless-stopped
    env_file: ${SERVICE_ENV_FILE:-.env}
    environment:
      APP_ROLE: worker
      APP_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    command: ['python', '-m', 'app.workers.run']

  bot:
    build:
      context: ./bot
      target: runtime
    image: rut-multibot/bot:${IMAGE_TAG:-rut}
    restart: unless-stopped
    env_file: ${SERVICE_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      BOT_RUNTIME_VERSION: ${BOT_RUNTIME_VERSION:-docker}
      BOT_SUPERVISOR_INTERVAL_SECONDS: ${BOT_SUPERVISOR_INTERVAL_SECONDS:-10}
    depends_on:
      backend:
        condition: service_healthy
    command: ['python', '-m', 'app.supervisor']
    volumes:
      - bot-secrets:/app/secrets:ro
    ports:
      - '127.0.0.1:8000:8080'

  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        VITE_MAX_BOT_USERNAME: ${MAX_BOT_USERNAME}
        VITE_MINIAPP_URL: ${PUBLIC_MINIAPP_URL}
    image: rut-multibot/frontend-admin:${IMAGE_TAG:-rut}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8002:80'

  frontend-miniapp:
    build:
      context: ./frontend-miniapp
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_WEBAPP_URL: ${PUBLIC_WEBAPP_URL}
        MAX_BOT_USERNAME: ${MAX_BOT_USERNAME}
        VITE_SITE_URL: ${PUBLIC_ADMIN_URL}
        VITE_BOT_SLUG: ${DEFAULT_BOT_SLUG:-default}
    image: rut-multibot/frontend-miniapp:${IMAGE_TAG:-rut}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8003:80'

volumes:
  db-data:
  redis-data:
  uploads-data:
  bot-secrets:
