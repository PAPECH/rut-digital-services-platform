server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50M;

  # See frontend-admin/nginx.conf for why this is here: without it, proxy_pass to a static
  # `backend:8000` hostname caches whatever IP the backend container had at nginx startup and
  # 502s after any backend container restart until this container is restarted too.
  resolver 127.0.0.11 valid=10s;

  location / { try_files $uri /index.html; }

  # No URI after the variable on purpose -- see frontend-admin/nginx.conf for why. Forwarding
  # the original /api/... URI unchanged is correct here since the backend itself expects /api/....
  location /api/ {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public technical endpoints required for the hackathon API verification.
  # Exact matches keep the SPA fallback from returning index.html for backend metadata.
  location = /healthz {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /openapi.json {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /redoc {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 7d;
    access_log off;
  }
}
